# tandem.flights lean base stack (2 vCPU / 3.7 GB shared Coolify server): Postgres + nightly backup.
# No Elasticsearch (DefaultSearchPlugin) and no Loki.
services:
    database:
        restart: always
        image: postgres:16
        container_name: tandem-vendure-db
        # small shared server: keep postgres lean
        command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
        mem_limit: 384m
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - coolify
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    backup:
        container_name: tandem-vendure-backup
        mem_limit: 128m
        platform: linux/amd64
        restart: unless-stopped
        build:
            context: .
            dockerfile: cron.Dockerfile
        image: tandem-vendure-backup
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - "/root/backups:/backups"
        # Cron does not inherit container env — persist vars for backup.sh (Coolify injects .env at deploy).
        command:
            - sh
            - "-c"
            - |
                printenv | grep -E '^(DB_|AWS_)' > /etc/environment
                echo '0 3 * * * . /etc/environment; /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1' | crontab -
                crond -f -l 2
        networks:
            - coolify
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
            interval: 1m
            timeout: 5s
            retries: 3
            start_period: 30s

    # maintenance:
