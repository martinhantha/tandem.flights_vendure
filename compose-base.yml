services:
    database:
        restart: always
        image: postgres:16
        container_name: database
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - coolify
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    elasticsearch:
        # Persisted data must be upgraded stepwise, e.g. 8.12 → 8.19 → 9.x (9.3.2 on an 8.12 volume crashes on boot)
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
            - xpack.security.enabled=false
        volumes:
            - esdata:/usr/share/elasticsearch/data
        networks:
            - coolify
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
    backup:
        container_name: backup
        platform: linux/amd64
        restart: unless-stopped
        build:
            context: .
            dockerfile: cron.Dockerfile
        image: vendure-backup
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - "/root/backups:/backups"
        # Cron does not inherit container env — persist vars for backup.sh (Coolify injects .env at deploy).
        command:
            - sh
            - "-c"
            - |
                printenv | grep -E '^(DB_|AWS_)' > /etc/environment
                echo '0 3 * * * . /etc/environment; /usr/local/bin/backup.sh >> /var/log/cron.log 2>&1' | crontab -
                crond -f -l 2
        networks:
            - coolify
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
            interval: 1m
            timeout: 5s
            retries: 3
            start_period: 30s

    loki:
        build:
            context: ./observability
            dockerfile: Dockerfile.loki
        image: vendure-loki:3.4.2
        restart: unless-stopped
        command: -config.file=/etc/loki/loki-config.yaml
        ports:
            - "127.0.0.1:3100:3100"
        volumes:
            - loki_data:/loki
        networks:
            coolify:
            log_drains:
                aliases:
                    - coolify-loki
        labels:
            - coolify.persistent=true
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s

    # maintenance:
    #   build:
    #     context: .
    #     dockerfile: base.Dockerfile
    #   volumes:
    #     - maintenance_data:/usr/share/nginx/html
    #   networks:
    #     - coolify
    #   labels:
    #     - traefik.enable=true
    #     - traefik.http.services.maintenance.loadbalancer.server.port=80
    #     - traefik.http.routers.maintenance.rule=Host(`vendure.hantha.digital`)
