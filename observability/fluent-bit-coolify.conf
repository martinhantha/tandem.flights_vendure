# Paste into Coolify: Server → Configuration → Log Drains → Custom FluentBit Configuration
# Requires Loki on network log-drains_default with alias "coolify-loki" (see compose-base.yml).

[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

[FILTER]
    Name    modify
    Match   *
    Rename  coolify.projectName project
    Rename  coolify.environmentName env
    Rename  coolify.serviceName service

[OUTPUT]
    Name         loki
    Match        *
    Host         coolify-loki
    Port         3100
    Labels       job=fluentbit
    Label_Keys   $project,$env,$service,$container_name,$container_id
    Line_Format  json
